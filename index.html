<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Schematic PDF Exporter — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 15px; margin-bottom: 20px; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .sheet-wrapper { display: flex; justify-content: center; padding: 20px; background: #1a1e28; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h2>📄 Vector Schematic PDF Exporter</h2>
    <button onclick="window.print()">Export / Print Vector PDF</button>
  </header>

  <p style="color:#94a3b8; font-size:14px;">Print-ready architectural title block and schematic border preview:</p>
  <div class="sheet-wrapper" id="sheet-preview"></div>

  <script type="module">
    import { generateTitleBlockSvg } from './js/pdfExport.js';
    document.getElementById('sheet-preview').innerHTML = generateTitleBlockSvg('STUDIO COMPLEX A', '01', '04');
  </script>
</body>
</html>
